name: Update grant radar data

on:
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data
        run: python scripts/build_data.py --fresh --verbose

      - name: Commit changes
        run: |
          if [[ -z "$(git status --porcelain data.js)" ]]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: refresh grant radar data"
          git push
