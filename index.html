<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dotace Manager - statický přehled</title>
  <style>
    :root { --bg:#f6f7f9; --surface:#fff; --line:#d9e0e7; --text:#17202a; --muted:#667085; --accent:#146c5f; --blue:#1f4e79; --ok:#027a48; --warn:#b54708; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; z-index:5; background:#14212b; color:white; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    h1 { margin:0; font-size:22px; letter-spacing:0; }
    .generated { color:#cbd5df; font-size:13px; }
    main { padding:22px; max-width:1500px; margin:0 auto; }
    .metrics { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .control-panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
    .control-title { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    .control-title h2 { margin:0; font-size:18px; }
    .tabs, .quick-filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .filters { display:grid; grid-template-columns:minmax(260px, 1fr) 180px 180px 160px; gap:10px; align-items:end; }
    .field { display:grid; gap:5px; }
    .field label { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; }
    button, select, input { border:1px solid var(--line); border-radius:6px; min-height:38px; padding:8px 10px; font:inherit; background:white; }
    button { cursor:pointer; font-weight:700; }
    button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .tab-button { min-height:48px; padding:10px 18px; font-size:15px; }
    .quick-button { min-height:36px; border-radius:999px; }
    .reset { color:var(--danger); border-color:#fecdca; }
    input { min-width:300px; flex:1; }
    .metric { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; min-width:160px; }
    .metric span { display:block; color:var(--muted); font-size:12px; }
    .metric strong { font-size:26px; }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:16px; }
    .notice { border-left:4px solid var(--accent); line-height:1.5; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; vertical-align:top; }
    th { background:#eef2f6; color:var(--muted); }
    a { color:var(--blue); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .badge { display:inline-flex; border-radius:999px; padding:3px 8px; font-size:12px; font-weight:700; background:#eef2f6; }
    .active-badge, .automatizováno { background:#d1fadf; color:var(--ok); }
    .completed-badge { background:#eceff3; color:#475467; }
    .unknown-badge, .ready-badge { background:#fef0c7; color:var(--warn); }
    .muted { color:var(--muted); }
    .compact { margin:6px 0 0; font-size:12px; line-height:1.4; }
    .hidden { display:none; }
    .results-bar { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; padding:14px; display:grid; gap:8px; }
    .card h3 { margin:0; font-size:16px; line-height:1.3; }
    .card p { margin:0; line-height:1.45; }
    @media (max-width: 900px) { .filters { grid-template-columns:1fr; } input { min-width:100%; } main { padding:14px; } table { font-size:12px; } }
  </style>
</head>
<body>
  <header>
    <h1>Dotace Manager</h1>
    <div class="generated" id="generated"></div>
  </header>
  <main>
    <section class="panel notice">
      <strong>Read-only GitHub Pages export.</strong>
      Tady je statický snapshot dat. Nový import zdrojů generuje soubor data.js lokálně přes Python pipeline.
    </section>
    <section class="metrics" id="metrics"></section>
    <section class="control-panel">
      <div class="control-title">
        <h2>Menu a filtry</h2>
        <span class="muted" id="resultCount"></span>
      </div>
      <nav class="tabs">
        <button class="tab-button active" data-view="items">Výzvy a obsah</button>
        <button class="tab-button" data-view="sources">Dotační zdroje</button>
      </nav>
      <section class="quick-filters" id="quickFilters">
        <button class="quick-button active" data-status="">Vše</button>
        <button class="quick-button" data-status="active">Probíhající</button>
        <button class="quick-button" data-status="completed">Ukončené</button>
        <button class="quick-button" data-status="unknown">Bez termínu</button>
        <button class="quick-button reset" id="resetFilters" type="button">Reset filtrů</button>
      </section>
      <section class="filters" id="itemFilters">
        <div class="field">
          <label for="q">Fulltext</label>
          <input id="q" type="search" placeholder="Hledat název, text, téma nebo zdroj">
        </div>
        <div class="field">
          <label for="status">Stav</label>
          <select id="status">
            <option value="">Všechny stavy</option>
            <option value="active">Probíhající</option>
            <option value="completed">Ukončené</option>
            <option value="unknown">Bez jasného termínu</option>
          </select>
        </div>
        <div class="field">
          <label for="type">Typ obsahu</label>
          <select id="type">
            <option value="">Všechny typy</option>
            <option value="grant">Dotace</option>
            <option value="article">Článek</option>
            <option value="event">Akce</option>
            <option value="page">Stránka</option>
            <option value="faq">FAQ</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">Řazení</label>
          <select id="sort">
            <option value="deadline">Termín</option>
            <option value="title">Název</option>
            <option value="status">Stav</option>
          </select>
        </div>
      </section>
      <section class="filters hidden" id="sourceFilters">
        <div class="field">
          <label for="sourceQ">Hledat ve zdrojích</label>
          <input id="sourceQ" type="search" placeholder="Např. IROP, OPŽP, kraj, EU">
        </div>
        <div class="field">
          <label for="integration">Napojení</label>
          <select id="integration">
            <option value="">Vše</option>
            <option value="automatizováno">Automatizováno</option>
            <option value="připraveno k napojení">Připraveno k napojení</option>
            <option value="ruční monitoring">Ruční monitoring</option>
          </select>
        </div>
      </section>
    </section>
    <div class="results-bar"><strong id="viewTitle">Výzvy a obsah</strong><span class="muted" id="viewHint"></span></div>
    <section id="itemsView" class="cards"></section>
    <section id="sourcesView" class="panel hidden"></section>
  </main>
  <script src="data.js?v=20260517-124006"></script>
  <script>
    const data = window.DOTACE_EXPORT;
    let view = "items";
    const el = (id) => document.getElementById(id);
    const norm = (value) => String(value || "").toLowerCase();
    document.getElementById("generated").textContent = `Vygenerováno: ${data.generated_at}`;
    document.getElementById("metrics").innerHTML = [
      ["Položky celkem", data.stats.total],
      ["Probíhající", data.stats.active],
      ["Ukončené", data.stats.completed],
      ["Bez termínu", data.stats.unknown],
      ["Zdroje", data.stats.sources],
    ].map(([label, value]) => `<article class="metric"><span>${label}</span><strong>${value}</strong></article>`).join("");
    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => {
        view = button.dataset.view;
        document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("active", b === button));
        el("itemsView").classList.toggle("hidden", view !== "items");
        el("sourcesView").classList.toggle("hidden", view !== "sources");
        el("itemFilters").classList.toggle("hidden", view !== "items");
        el("quickFilters").classList.toggle("hidden", view !== "items");
        el("sourceFilters").classList.toggle("hidden", view !== "sources");
        el("viewTitle").textContent = view === "items" ? "Výzvy a obsah" : "Dotační zdroje";
        render();
      });
    });
    ["q", "status", "type", "sort", "sourceQ", "integration"].forEach((id) => el(id).addEventListener("input", render));
    document.querySelectorAll("[data-status]").forEach((button) => {
      button.addEventListener("click", () => {
        el("status").value = button.dataset.status;
        document.querySelectorAll("[data-status]").forEach((b) => b.classList.toggle("active", b === button));
        render();
      });
    });
    el("resetFilters").addEventListener("click", () => {
      ["q", "status", "type", "sourceQ", "integration"].forEach((id) => el(id).value = "");
      document.querySelectorAll("[data-status]").forEach((b) => b.classList.toggle("active", b.dataset.status === ""));
      render();
    });
    function render() {
      if (view === "sources") return renderSources();
      const query = norm(el("q").value);
      const status = el("status").value;
      const type = el("type").value;
      const sort = el("sort").value;
      const allFiltered = data.items.filter((item) => {
        const haystack = norm([item.title, item.text, item.summary, item.type, item.status, item.source_name, item.program].join(" "));
        return (!query || haystack.includes(query)) && (!status || item.status_code === status) && (!type || item.type_code === type);
      }).sort((a, b) => {
        if (sort === "title") return a.title.localeCompare(b.title, "cs");
        if (sort === "status") return a.status.localeCompare(b.status, "cs") || a.title.localeCompare(b.title, "cs");
        return (a.deadline || "9999-99-99").localeCompare(b.deadline || "9999-99-99") || a.title.localeCompare(b.title, "cs");
      });
      const filtered = allFiltered.slice(0, 400);
      el("resultCount").textContent = `${allFiltered.length} výsledků`;
      el("viewHint").textContent = `Zobrazeno ${filtered.length} z ${allFiltered.length}.`;
      el("itemsView").innerHTML = filtered.map((item) => `
        <article class="card">
          <h3><a href="${item.source_url}" target="_blank" rel="noreferrer">${escapeHtml(item.title)}</a></h3>
          <div>
            <span class="badge ${item.status_code}-badge">${item.status}</span>
            <span class="badge">${item.type}</span>
            ${item.source_name ? `<span class="badge">${escapeHtml(item.source_name)}</span>` : ""}
            ${item.program ? `<span class="badge">${escapeHtml(item.program)}</span>` : ""}
            ${item.deadline ? `<span class="badge">Termín ${item.deadline}</span>` : ""}
            <span class="badge">${(item.attachments || []).length} příloh</span>
          </div>
          <p class="muted">${escapeHtml(item.text || item.summary || "Bez extrahovaného textu.")}</p>
        </article>
      `).join("") || `<article class="panel">Nic nenalezeno.</article>`;
    }
    function renderSources() {
      const query = norm(el("sourceQ").value);
      const integration = el("integration").value;
      const sources = data.sources.filter((source) => {
        const haystack = norm([source.name, source.category, source.type, source.topics, source.target_groups, source.notes, source.integration].join(" "));
        return (!query || haystack.includes(query)) && (!integration || source.integration === integration);
      });
      el("resultCount").textContent = `${sources.length} zdrojů`;
      el("viewHint").textContent = "Katalog zdrojů, ne seznam stažených výzev.";
      el("sourcesView").innerHTML = `
        <table>
          <thead><tr><th>Zdroj</th><th>Kategorie</th><th>Typ</th><th>Témata</th><th>Napojení</th></tr></thead>
          <tbody>${sources.map((source) => `
            <tr>
              <td><a href="${source.url}" target="_blank" rel="noreferrer">${escapeHtml(source.name)}</a><p class="muted compact">${escapeHtml(source.notes)}</p></td>
              <td>${escapeHtml(source.category)}</td>
              <td>${escapeHtml(source.type)}</td>
              <td>${escapeHtml(source.topics)}</td>
              <td><span class="badge ${source.integration === "automatizováno" ? "active-badge" : "ready-badge"}">${escapeHtml(source.integration)}</span></td>
            </tr>
          `).join("")}</tbody>
        </table>`;
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[ch]));
    }
    render();
  </script>
</body>
</html>
